<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymBlack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymBlack">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{
  --bg:#0A0A0B;--s1:#151618;--s2:#1F2023;--line:#2F3135;--ink:#F2F3F5;--muted:#9A9EA6;
  --fuego:#C9CED6;--fuego2:#EDEFF3;--ok:#3DDC84;--frio:#6FB7FF;--rojo:#FF5C5C;
  --f:"Barlow",system-ui,sans-serif;--fd:"Barlow Condensed","Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 var(--f)}
body{padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;
  background:radial-gradient(120% 60% at 50% -10%,#24272C 0%,transparent 60%),var(--bg);min-height:100vh}
h1,h2,h3{font-family:var(--fd);letter-spacing:.3px;margin:0}
h1{font-size:34px;font-weight:800}h2{font-size:24px;font-weight:800}h3{font-size:19px;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--ink)}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.logo{width:42px;height:42px;border-radius:12px;background:#000 url(logo-app.png) center/cover;box-shadow:0 0 0 1px #3A3E46,0 4px 18px #0008}
.top .t{flex:1}.top small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-size:13px}
.chip.f{background:#C9CED622;border-color:#C9CED666;color:var(--fuego2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px}
.card.hero{background:linear-gradient(160deg,#1E2025,#151618 70%);border-color:#3A3E46}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}.row.w{flex-wrap:wrap}.sp{flex:1}
.btn{border:0;border-radius:16px;padding:14px 18px;font:800 17px var(--f);background:var(--fuego);color:#0B0C0E;box-shadow:0 4px 0 #70757E;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #70757E}
.btn.sec{background:var(--s2);color:var(--ink);box-shadow:0 4px 0 #0006;border:1px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #1E8A4F;color:#04210F}
.btn.chico{width:auto;padding:9px 14px;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:#0A0A0BF0;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav div{display:flex;width:100%;max-width:620px}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-weight:800;font-size:12px;border-radius:14px}
.nav button span{font-size:23px;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--fuego2);background:#C9CED614}.nav button.on span{filter:none;opacity:1}
.ej{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ej:first-child{border-top:0}
.num{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--s2);font:800 15px var(--fd);color:var(--fuego2)}
.ej b{display:block}.ej .d{color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--s2);color:var(--ink)}
.tag.tec{background:#C9CED626;color:var(--fuego2)}
.comida{border-radius:18px;background:var(--s2);border:1px solid var(--line);padding:14px;margin-bottom:10px}
.comida.ya{border-color:#3DDC8466;background:#132218}
.comida.ahora{border-color:var(--fuego);box-shadow:0 0 0 1px var(--fuego) inset}
.comida .h{font:800 22px var(--fd);color:var(--fuego2);min-width:58px}
.comida.ya .h{color:var(--ok)}
.items{margin:10px 0 0;padding:0;list-style:none}
.items li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #ffffff14}
.items li span:last-child{color:var(--fuego2);font-weight:800;text-align:right}
.check{flex:none;width:34px;height:34px;border-radius:11px;border:2px solid var(--line);background:none;display:grid;place-items:center;font-size:18px}
.comida.ya .check{background:var(--ok);border-color:var(--ok);color:#04210F}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;border:0;border-radius:9px;padding:7px 4px;background:none;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--s1);color:var(--ink)}
.barra{height:10px;border-radius:99px;background:var(--s2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--fuego),var(--fuego2));transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:800 24px var(--fd)}.stat small{color:var(--muted);font-weight:700;font-size:12px}
.agua{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vaso{width:34px;height:40px;border-radius:6px 6px 10px 10px;border:2px solid var(--frio);background:none;padding:0}
.vaso.lleno{background:linear-gradient(0deg,var(--frio) 80%,transparent 80%)}
.guia{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.guia .in{max-width:620px;margin:0 auto}
.prog{display:flex;gap:4px;margin:8px 0 14px}.prog i{flex:1;height:5px;border-radius:9px;background:var(--s2)}.prog i.ok{background:var(--ok)}.prog i.on{background:var(--fuego)}
.objetivo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.objetivo div{background:var(--s2);border-radius:14px;padding:10px 6px;text-align:center}
.objetivo b{display:block;font:800 26px var(--fd);color:var(--fuego2)}.objetivo small{font-size:12px;color:var(--muted);font-weight:800}
.num-in{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:16px;padding:6px}
.num-in button{width:48px;height:48px;border-radius:12px;border:0;background:var(--s1);font:800 24px var(--fd)}
.num-in input{flex:1;min-width:0;text-align:center;background:none;border:0;font:800 32px var(--fd);outline:none}
.lbl{font-size:13px;color:var(--muted);font-weight:800;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.rirs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rirs button{border:2px solid var(--line);background:var(--s2);border-radius:12px;padding:8px 0;font-weight:800}
.rirs button small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.rirs button.on{border-color:var(--fuego);background:#C9CED622}
.reloj{width:230px;height:230px;margin:20px auto;position:relative}
.reloj svg{transform:rotate(-90deg)}
.reloj .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.reloj .t b{font:800 64px/1 var(--fd)}
.consejo{background:#C9CED614;border:1px solid #C9CED644;border-radius:14px;padding:10px 12px;font-size:15px;margin-top:10px}
.tempo{display:flex;gap:6px;margin-top:10px}
.tempo div{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:var(--s2);font-weight:800;font-size:13px;transition:.2s}
.tempo div b{display:block;font:800 22px var(--fd)}
.tempo div.on{background:var(--fuego);color:#0B0C0E;transform:scale(1.06)}
.series{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.serie{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:#132218;color:var(--ok);font-weight:700}
.campo{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--s2);font-size:18px;outline:none}
.campo:focus{border-color:var(--fuego)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#F2F3F5;color:#0B0C0E;padding:11px 16px;border-radius:14px;font-weight:800;box-shadow:0 8px 24px #0008;max-width:90vw;text-align:center;animation:sube .25s}
@keyframes sube{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes late{50%{transform:scale(1.08)}}
.late{animation:late 1s infinite}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.dias div{text-align:center;padding:8px 0;border-radius:10px;background:var(--s2);font-size:12px;font-weight:800;color:var(--muted)}
.dias div.en{color:var(--ink)}.dias div.hoy{outline:2px solid var(--fuego)}.dias div.hecho{background:#132218;color:var(--ok)}
.graf{width:100%;height:160px}
details summary{cursor:pointer;font-weight:800;padding:4px 0}
.foto{position:relative;border-radius:16px;overflow:hidden;background:#fff;aspect-ratio:4/3;margin-top:12px}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto .b{animation:ver 2.8s infinite}
@keyframes ver{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@keyframes ver2{0%,38%{opacity:1}50%,88%{opacity:0}100%{opacity:1}}
.foto .et{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:8px;background:#000c;color:#fff;font-size:12px;font-weight:800}
.foto .et.a2{animation:ver2 2.8s infinite}
.mini{flex:none;width:66px;height:50px;border-radius:10px;object-fit:cover;background:#fff}
.hojaF{position:fixed;inset:0;z-index:40;background:#000b;animation:sube2 .2s}
.hojaF .in{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--s1);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
@keyframes sube2{from{opacity:0}}
.alt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin-top:8px}
.alt.on{border-color:var(--fuego)}
.btn.no{background:#2A1416;color:#FF9C9C;box-shadow:0 4px 0 #0008;border:1px solid #5A2A2E}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px}.chk input{flex:none;width:22px;height:22px;accent-color:#C9CED6}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla td{padding:7px 4px;border-bottom:1px solid var(--line)}.tabla td:last-child{text-align:right;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"><div>
  <button data-t="hoy"><span>⚡</span>Hoy</button>
  <button data-t="entreno"><span>🏋️</span>Entrenar</button>
  <button data-t="comidas"><span>🍽️</span>Comidas</button>
  <button data-t="progreso"><span>📈</span>Progreso</button>
</div></nav>
<div id="guia"></div>
<div id="hoja"></div>
<script src="media.js"></script>
<script>
"use strict";
/* ============ RUTINA: HYPERTROPHY ELITE PROGRAM v2 ============ */
// c = compuesto (multiarticular) · tec = técnica especial del último set (se usa en las semanas 7–11)
const RUTINA = {
  UA:{nombre:"Día 1 · Upper A", corto:"Upper A", foco:"Pecho + Espalda + Deltoides lateral + Tríceps", ej:[
    {id:"ua1",n:"Press inclinado con barra",eq:"Banco 30–45° + barra olímpica",m:"Pecho (parte alta)",s:4,r:"6–10",d:120,t:"3-1-1-0",c:1,tip:"Escápulas juntas y abajo. Bajá la barra a la parte alta del pecho."},
    {id:"ua2",n:"Remo polea baja agarre neutro",eq:"Polea baja + triángulo",m:"Dorsal / romboides / bíceps",s:4,r:"8–12",d:90,t:"3-1-1-0",c:1,tip:"Pecho alto, tirá con los codos hacia la cadera. No balancees el torso."},
    {id:"ua3",n:"Apertura inclinada con poleas altas",eq:"Dos poleas altas cruzadas",m:"Pecho (estiramiento)",s:3,r:"12–15",d:90,t:"3-0-1-0",tip:"Codos apenas flexionados. Abrí hasta sentir que estira el pecho."},
    {id:"ua4",n:"Jalón al pecho agarre prono medio",eq:"Polea alta + barra recta",m:"Dorsal / redondo mayor",s:4,r:"8–12",d:90,t:"3-1-1-0",c:1,tip:"Llevá la barra a la clavícula con el pecho arriba. Controlá la subida."},
    {id:"ua5",n:"Elevación lateral en máquina",eq:"Máquina de deltoides laterales",m:"Deltoides lateral ★",s:5,r:"12–15",d:60,t:"2-0-1-0",tec:"myo",tip:"Empujá con los codos hasta la altura del hombro. Sin encoger."},
    {id:"ua6",n:"Elevación lateral polea baja (a un brazo)",eq:"Polea baja + agarre simple",m:"Deltoides lateral ★",s:3,r:"15–20",d:45,t:"2-0-1-0",tip:"El cable pasa por delante del cuerpo. Subí hasta el hombro. Hacé las reps con un brazo y después con el otro."},
    {id:"ua7",n:"Extensión de tríceps polea alta (cuerda)",eq:"Polea alta + cuerda",m:"Tríceps ★",s:5,r:"12–15",d:75,t:"2-0-1-0",tip:"Codos pegados al cuerpo y quietos. Abrí la cuerda al final."},
    {id:"ua8",n:"Curl martillo en polea baja (cuerda)",eq:"Polea baja + cuerda",m:"Bíceps / braquial ★",s:4,r:"12–15",d:90,t:"3-0-1-0",tip:"Palmas enfrentadas, codos quietos al costado."}]},
  LA:{nombre:"Día 2 · Lower A", corto:"Lower A", foco:"Piernas · cuádriceps dominante", ej:[
    {id:"la1",n:"Sentadilla alta (high bar)",eq:"Rack + barra olímpica",m:"Cuádriceps / glúteos / core",s:4,r:"6–10",d:180,t:"3-1-1-0",c:1,tip:"Barra sobre los trapecios, pecho arriba. Bajá al menos hasta paralelo."},
    {id:"la2",n:"Leg press 45°",eq:"Máquina leg press 45°",m:"Cuádriceps / glúteos",s:3,r:"10–15",d:120,t:"3-0-1-0",c:1,tec:"drop",tip:"Bajá profundo sin despegar la cola del respaldo. No trabes las rodillas arriba."},
    {id:"la3",n:"Extensión de cuádriceps (recorrido completo)",eq:"Máquina de extensiones",m:"Cuádriceps",s:3,r:"12–15",d:90,t:"2-2-1-0",tip:"Pausa de 2 s abajo, estirando. Arriba extendé del todo."},
    {id:"la4",n:"Curl femoral tumbado",eq:"Máquina de curl femoral acostado",m:"Isquiotibiales",s:4,r:"10–15",d:90,t:"3-1-1-0",tip:"Cadera pegada al banco. Bajá lento."},
    {id:"la5",n:"Peso muerto rumano (RDL)",eq:"Barra olímpica + discos",m:"Isquiotibiales / glúteos",s:3,r:"8–12",d:120,t:"4-1-1-0",c:1,tip:"Rodillas apenas flexionadas, cadera hacia atrás, barra pegada a las piernas, espalda recta."},
    {id:"la6",n:"Pantorrilla de pie",eq:"Máquina de gemelos de pie",m:"Gemelos",s:4,r:"12–15",d:60,t:"2-2-1-0",tip:"2 s abajo estirando, subí bien arriba en puntas."}]},
  UB:{nombre:"Día 3 · Upper B", corto:"Upper B", foco:"Hombros + Espalda + Brazos", ej:[
    {id:"ub1",n:"Press militar con barra",eq:"Rack + barra olímpica",m:"Hombros / tríceps",s:4,r:"6–10",d:120,t:"3-1-1-0",c:1,tip:"Glúteos y abdomen firmes. La barra sube recta, pasando cerca de la cara."},
    {id:"ub2",n:"Remo con mancuerna pecho apoyado",eq:"Banco inclinado 30° + mancuernas",m:"Dorsal / romboides / bíceps",s:4,r:"8–12",d:90,t:"3-1-1-0",c:1,tip:"Pecho apoyado todo el tiempo. Tirá los codos hacia atrás."},
    {id:"ub3",n:"Press con mancuernas banco plano",eq:"Banco plano + mancuernas",m:"Pecho",s:3,r:"10–12",d:90,t:"3-1-1-0",c:1,tip:"Bajá hasta sentir estiramiento, con los codos a unos 45° del cuerpo."},
    {id:"ub4",n:"Elevación lateral polea baja (a un brazo)",eq:"Polea baja + agarre simple",m:"Deltoides lateral ★",s:5,r:"15–20",d:60,t:"2-0-1-0",tec:"rest",tip:"El cable pasa por delante del cuerpo. Subí hasta el hombro. Hacé las reps con un brazo y después con el otro."},
    {id:"ub5",n:"Curl inclinado con mancuernas",eq:"Banco inclinado 45° + mancuernas",m:"Bíceps (cabeza larga) ★",s:4,r:"10–15",d:90,t:"3-0-1-0",tip:"Brazos colgando por detrás del cuerpo. No adelantes los codos."},
    {id:"ub6",n:"Extensión de tríceps sobre la cabeza con cable",eq:"Polea baja + cuerda",m:"Tríceps (cabeza larga) ★",s:4,r:"12–15",d:90,t:"3-0-1-0",tip:"De espaldas a la polea, codos arriba y quietos. Estirá bien atrás."},
    {id:"ub7",n:"Pájaro en máquina (deltoides posterior)",eq:"Pec deck en posición invertida",m:"Deltoides posterior",s:3,r:"12–15",d:75,t:"2-1-1-0",tip:"Brazos casi rectos, abrí hacia atrás. Pausa de 1 s."},
    {id:"ub8",n:"Curl con barra EZ",eq:"Barra EZ + discos",m:"Bíceps ★",s:4,r:"8–12",d:90,t:"3-0-1-0",tip:"Codos quietos, sin balancear el cuerpo."},
    {id:"ub9",n:"Rompecráneos con barra EZ",eq:"Banco plano + barra EZ",m:"Tríceps ★",s:3,r:"10–12",d:75,t:"3-0-1-0",tip:"Bajá la barra detrás de la frente con los codos apuntando al techo."}]},
  LB:{nombre:"Día 4 · Lower B", corto:"Lower B", foco:"Piernas · cadena posterior", ej:[
    {id:"lb1",n:"Peso muerto rumano pesado",eq:"Barra olímpica + discos",m:"Isquios / glúteos / lumbares",s:4,r:"6–10",d:180,t:"4-1-1-0",c:1,tip:"Cadera atrás, barra pegada a las piernas, espalda recta. 4 s bajando."},
    {id:"lb2",n:"Hack squat",eq:"Máquina hack squat",m:"Cuádriceps",s:4,r:"10–12",d:120,t:"3-0-1-0",c:1,tip:"Espalda pegada al respaldo, bajá profundo."},
    {id:"lb3",n:"Curl femoral sentado",eq:"Máquina de curl femoral sentado",m:"Isquiotibiales",s:4,r:"10–15",d:90,t:"3-1-1-0",tec:"drop",tip:"Trabá bien los muslos con el rodillo. Estirá del todo arriba."},
    {id:"lb4",n:"Sentadilla búlgara con mancuernas",eq:"Banco + mancuernas",m:"Cuádriceps / glúteos",s:3,r:"10–12",d:120,t:"3-0-1-0",c:1,tip:"Pie de atrás sobre el banco. Hacé las reps con una pierna y después con la otra."},
    {id:"lb5",n:"Hip thrust con barra",eq:"Banco + barra + almohadilla",m:"Glúteo mayor",s:3,r:"12–15",d:90,t:"2-2-1-0",c:1,tip:"Espalda alta apoyada en el banco. Subí hasta alinear torso y muslos y apretá los glúteos."},
    {id:"lb6",n:"Pantorrilla sentado",eq:"Máquina de gemelos sentado",m:"Sóleo",s:4,r:"15–20",d:60,t:"2-2-1-0",tip:"2 s abajo estirando, subí bien arriba."}]}
};
// getDay(): 0 = domingo … 6 = sábado
const SEMANA_DIAS = {1:"UA",2:"LA",4:"UB",5:"LB"};
const NOMBRE_DIA = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
// Tabla de progresión — 12 semanas (página 8 del PDF)
const SEMANAS = [
  {b:"Acumulación I",sc:3,sa:3,rc:"10–12",ra:"15–20",carga:"65–70%",rir:"3–4",nota:"Aprendé la técnica de los ejercicios. Sin llegar al fallo. Es la base."},
  {b:"Acumulación I",sc:3,sa:3,rc:"10–12",ra:"12–15",carga:"68–72%",rir:"3",nota:"+2.5 kg en compuestos si la semana pasada te sobraban 4 o más reps."},

  if (!E || !E.inicio) return {n:1, ciclo:1};

}

const rango = s => s.split("–").map(Number);
const redondear = (kg, paso) => Math.max(0, Math.round(kg / paso) * paso);

function hojaAccion(a, b){
  if (a === "cerrar") return cerrarHoja();

  if (a === "elegir" || a === "original") {
    const id = b.dataset.id;
    E.var = E.var || {};

    else E.var[id] = {k: +b.dataset.k, f: $("#siempre").checked ? null : hoyStr()};
    guardar(); sonar("listo"); cerrarHoja();

      if (R.ej[E.sesion.i] && R.ej[E.sesion.i].id === id) { const ea = ejActivo(R.ej[E.sesion.i]); E.sesion.serie = Math.min(objetivo(ea, semanaActual().n).series - 1, (E.sesion.sets[ea.id] || []).length); }
      guardar(); pintarGuia();
    } else render();
  }
}

// Lo que toca en cada ejercicio según la semana del programa (tabla de progresión)
function objetivo(ej, sem){
  const S = SEMANAS[sem - 1];
  const series = sem === 12 ? 2 : Math.max(2, ej.s + ((ej.c ? S.sc : S.sa) - 4));
  const rirMin = parseInt(S.rir, 10);
  const tec = ej.tec && sem >= 7 && sem <= 11 ? TECNICAS[ej.tec] : null;
  return {series, reps: ej.c ? S.rc : S.ra, rir: S.rir, rirMin, tec, desc: sem === 12 ? Math.max(90, Math.min(120, ej.d)) : ej.d};
}
// Peso sugerido: criterios de progresión de cargas (página 8 del PDF)
function sugerencia(ej, obj){
  const h = E.hist[ej.id];
  const [rmin] = rango(obj.reps);
  if (!h || !h.length) return {kg:null, txt:`Primera vez: elegí un peso con el que llegues a ${obj.reps} reps y te sobren ${obj.rir} (RIR).`};
  const sets = h[h.length - 1].sets.filter(s => s.kg > 0);
  if (!sets.length) return {kg:null, txt:`La vez pasada no anotaste peso: elegí uno que te deje ${obj.rir} reps en reserva.`};
  const base = Math.max(...sets.map(s => s.kg));
  const faltas = sets.filter(s => s.reps < rmin).length;
  const sobra = sets.every(s => s.rir > obj.rirMin && s.reps >= rmin);
  const paso = ej.c ? 2.5 : 1.25;
  if (faltas >= 2) { const kg = redondear(base * 0.925, 1.25); return {kg, tipo:"baja", txt:`La vez pasada no llegaste al mínimo de reps en ${faltas} series: bajá a ${fmtKg(kg)} kg y recuperá la progresión.`}; }
  if (sobra) { const kg = base + paso; return {kg, tipo:"sube", txt:`La vez pasada te sobró reserva en todas las series: subí a ${fmtKg(kg)} kg (+${fmtKg(paso)}).`}; }
  return {kg:base, tipo:"igual", txt:`Mantené ${fmtKg(base)} kg hasta completar todas las series con RIR ${obj.rir}.`};
}
// Duración estimada de un ejercicio: series × reps × tempo + descansos
function duracion(ej, obj){
  const [a, b] = rango(obj.reps), tempo = ej.t.split("-").reduce((x, y) => x + +y, 0);
  return obj.series * (a + b) / 2 * tempo + (obj.series - 1) * obj.desc + 60;
}
const minutos = s => Math.round(s / 60);
const fmtDesc = s => s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : s + " s";
function duracionDia(k, sem){ return RUTINA[k].ej.reduce((t, ej) => t + duracion(ej, objetivo(ej, sem)), 0) + 600; }

function pHoy(){
  const d = new Date(), dia = hoyEntrena(), s = semanaActual(), S = SEMANAS[s.n - 1], hecho = E.entrenos[hoyStr()];
  let h = instalarCard() + `<div id="offlineEstado">${textoOffline()}</div>`;

    h += `<div class="card hero"><div class="row w"><span class="chip f">${NOMBRE_DIA[d.getDay()]}</span><span class="chip">⏱️ ~${minutos(duracionDia(dia, s.n))} min</span><span class="chip">🕛 12:00</span></div>
      <h2 style="margin-top:10px">${hecho ? "✅ " : "🏋️ "}${R.nombre}</h2><p class="muted" style="margin:4px 0 12px">${R.foco} · ${R.ej.length} ejercicios</p>

  } else {

      <p class="muted" style="margin:6px 0 0">El músculo crece recuperando. Comé todo el plan, tomá la creatina y dormí 7–8 h.${siguienteEntreno()}</p></div>`;
  }
  h += `<div class="card"><h3>📅 Semana ${s.n} · ${S.b}</h3><p class="small muted" style="margin:6px 0 0">${S.nota}</p>${diasSemana()}</div>`;
  const prox = comidaAhora();
  h += `<div class="card"><div class="row"><h3>🍽️ Comidas de hoy</h3><span class="sp"></span><span class="chip">${comidasHechas()}/${COMIDAS.filter(c => !c.opc).length}</span></div>
    ${prox ? `<p style="margin:8px 0 10px">Ahora toca: <b style="color:var(--fuego2)">${prox.h} · ${nombreComida(prox)}</b></p>` : `<p style="color:var(--ok);font-weight:800">¡Todas las comidas del día listas! 🎉</p>`}

  h += aguaCard();
  return h;

  const g = Math.round((ahora - antes) / dias * 7 * 1000);

    const ej = ejActivo(R.ej[ss.i]), o = objetivo(ej, sem), sg = sugerencia(ej, o), hechos = ss.sets[ej.id] || [];
    const kgPrevio = hechos.length ? hechos[hechos.length - 1].kg : sg.kg != null ? sg.kg : (E.ultimoKg[ej.id] || "");
    const [, rmax] = rango(o.reps), repsPrevio = hechos.length ? hechos[hechos.length - 1].reps : rmax;
    const tp = ej.t.split("-"), paso = ej.c ? 2.5 : 1.25;
    h = `${arriba}<div class="small muted" style="font-weight:800">EJERCICIO ${ss.i + 1} DE ${R.ej.length}</div>
      <h1 style="font-size:30px;line-height:1.05;margin:4px 0 8px">${ej.n}</h1>
      <div class="row w"><span class="chip">🛠️ ${ej.eq}</span><span class="chip">🎯 ${ej.m}</span>${ej.base ? '<span class="chip f">🔁 variante</span>' : ""}</div>
      ${foto(ej)}
      <p class="small" style="margin:8px 0 0">💬 ${ej.tip}</p>
      <button class="btn no chico" data-g="variantes" style="width:100%;margin-top:10px">🚫 No se puede realizar · ver variantes</button>
      <div class="objetivo"><div><b>${ss.serie + 1}/${o.series}</b><small>SERIE</small></div><div><b>${o.reps}</b><small>REPS</small></div><div><b>${o.rir}</b><small>RIR</small></div></div>
      <div class="consejo">${{sube:"📈 ", baja:"📉 ", igual:"💡 "}[sg.tipo] || "💡 "}${sg.txt}</div>
      ${ss.serie === o.series - 1 && o.tec ? `<div class="consejo" style="background:#C9CED630"><b>★ Último set: ${o.tec.n}</b><br>${o.tec.t}${ej.tec === "drop" && kgPrevio ? ` (≈ ${fmtKg(redondear(kgPrevio * 0.8, 1.25))} kg)` : ""}</div>` : ""}
      <div class="lbl">Ritmo de cada repetición · ${ej.t}</div>
      <div class="tempo" id="tempo"><div><b>${tp[0]}s</b>bajá</div><div><b>${tp[1]}s</b>pausa</div><div><b>${tp[2]}s</b>subí</div><div><b>${tp[3]}s</b>arriba</div></div>
      <button class="btn sec chico" data-g="ritmo" style="margin-top:8px;width:100%">▶ Marcame el ritmo</button>
      <div class="lbl">Peso que usaste (kg)</div>
      <div class="num-in"><button data-g="kg" data-d="-${paso}">−</button><input id="gKg" type="number" inputmode="decimal" step="0.25" value="${kgPrevio}" placeholder="kg"><button data-g="kg" data-d="${paso}">+</button></div>
      <div class="lbl">Repeticiones que hiciste</div>
      <div class="num-in"><button data-g="rep" data-d="-1">−</button><input id="gRep" type="number" inputmode="numeric" value="${repsPrevio}"><button data-g="rep" data-d="1">+</button></div>
      <div class="lbl">¿Cuántas más podías hacer? (RIR)</div>
      <div class="rirs">${[0, 1, 2, 3, 4].map(r => `<button data-g="rir" data-r="${r}" class="${r === Math.min(4, o.rirMin) ? "on" : ""}">${r}${r === 4 ? "+" : ""}<small>${["ninguna", "1 más", "2 más", "3 más", "4 o más"][r]}</small></button>`).join("")}</div>
      <button class="btn ok" data-g="serie" style="margin-top:16px">✓ Terminé la serie ${ss.serie + 1}</button>
      ${hechos.length ? `<div class="series">${hechos.map((s, i) => `<div class="serie"><span>Serie ${i + 1}</span><span>${fmtKg(s.kg)} kg × ${s.reps} · RIR ${s.rir}</span></div>`).join("")}</div>` : ""}
      <div class="row" style="margin-top:14px"><button class="btn sec chico" data-g="atras">← Anterior</button><span class="sp"></span><button class="btn sec chico" data-g="saltar">Saltar ejercicio →</button></div>`;
  }
  $("#guia").innerHTML = `<div class="guia"><div class="in">${h}</div></div>`;
  engancharGuia();
}
function pintarDescanso(arriba){
  const ss = E.sesion, R = RUTINA[ss.dia], sem = semanaActual().n, total = ss.descansoTotal || 60;
  let prox;
  if (ss.i >= R.ej.length) prox = "¡Era la última serie! 🏁";
  else if (ss.serie === 0) { const pe = ejActivo(R.ej[ss.i]), pi = imgDe(pe); prox = `Próximo ejercicio:<br><b style="font-size:20px">${pe.n}</b><br><span class="small muted">🛠️ ${pe.eq} — andá preparando la máquina</span>${pi ? `<br><img class="mini" style="width:140px;height:105px;margin-top:10px" src="${rutaFoto(pi, 1)}" alt="">` : ""}`; }
  else prox = `Próximo: <b>serie ${ss.serie + 1} de ${objetivo(ejActivo(R.ej[ss.i]), sem).series}</b>`;
  $("#guia").innerHTML = `<div class="guia"><div class="in">${arriba}
    <div style="text-align:center"><div class="lbl" style="margin-top:6px">DESCANSO</div>
    <div class="reloj"><svg width="230" height="230"><circle cx="115" cy="115" r="104" stroke="#1F2023" stroke-width="14" fill="none"/>
    <circle id="arco" cx="115" cy="115" r="104" stroke="#C9CED6" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="653.5" stroke-dashoffset="0"/></svg>
    <div class="t"><div><b id="seg">--</b><div class="muted small" id="segU">segundos</div></div></div></div>
    <p style="font-size:17px">${prox}</p>
    <div class="row"><button class="btn sec" data-g="menos">−15 s</button><button class="btn sec" data-g="mas">+15 s</button></div>
    <button class="btn" data-g="yasta" style="margin-top:12px">Listo, sigo →</button></div></div></div>`;
  engancharGuia();
  const tic = () => {
    const quedan = Math.max(0, Math.ceil((ss.descansoHasta - Date.now()) / 1000)), s = $("#seg"); if (!s) return;
    s.textContent = quedan >= 60 ? Math.floor(quedan / 60) + ":" + String(quedan % 60).padStart(2, "0") : quedan;
    $("#segU").textContent = quedan >= 60 ? "minutos" : "segundos";
    $("#arco").setAttribute("stroke-dashoffset", String(653.5 * (1 - quedan / total)));
    s.parentElement.classList.toggle("late", quedan <= 5 && quedan > 0);
    if (quedan === 0) { clearInterval(reloj); reloj = null; sonar("fin"); vibrar([200, 100, 200]); finDescanso(); }
  };
  tic(); reloj = setInterval(tic, 250);
}
function finDescanso(){ E.sesion.descansoHasta = null; guardar(); pintarGuia(); }
function engancharGuia(){ document.querySelectorAll("#guia [data-g]").forEach(b => b.onclick = () => guia(b.dataset.g, b)); }
function guia(a, b){
  const ss = E.sesion, R = RUTINA[ss.dia], sem = semanaActual().n;
  if (a === "salir") return cerrarGuia();
  if (a === "arrancar") { ss.i = 0; ss.serie = 0; guardar(); sonar("listo"); return pintarGuia(); }
  if (a === "kg" || a === "rep") { const i = a === "kg" ? $("#gKg") : $("#gRep"); i.value = Math.max(0, Math.round(((parseFloat(String(i.value).replace(",", ".")) || 0) + parseFloat(b.dataset.d)) * 100) / 100); sonar("toque"); return; }
  if (a === "rir") { document.querySelectorAll("[data-g=rir]").forEach(x => x.classList.toggle("on", x === b)); sonar("toque"); return; }
  if (a === "ritmo") return ritmoOn ? detenerRitmo() : marcarRitmo(ejActivo(R.ej[ss.i]));
  if (a === "variantes") { detenerRitmo(); return hojaVariantes(R.ej[ss.i].id); }
  if (a === "serie") {
    detenerRitmo();
    const ej = ejActivo(R.ej[ss.i]), o = objetivo(ej, sem);
    const kg = parseFloat(String($("#gKg").value).replace(",", ".")) || 0, reps = parseInt($("#gRep").value, 10) || 0;
    if (!kg) { toast("Anotá el peso que usaste (kg)"); $("#gKg").focus(); return; }
    if (!reps) { toast("Anotá cuántas repeticiones hiciste"); return; }
    const sel = document.querySelector("[data-g=rir].on"), rir = sel ? +sel.dataset.r : o.rirMin;
    (ss.sets[ej.id] = ss.sets[ej.id] || []).push({kg, reps, rir});
    E.ultimoKg[ej.id] = kg; sonar("listo"); vibrar(30);
    ss.serie++;
    let desc = o.desc;
    if (ss.serie >= o.series) { ss.i++; ss.serie = 0; if (ss.i >= R.ej.length) { guardar(); return pintarGuia(); } desc = Math.max(desc, 90); }
    ss.descansoTotal = desc; ss.descansoHasta = Date.now() + desc * 1000; guardar(); return pintarGuia();
  }
  if (a === "menos" || a === "mas") {
    ss.descansoHasta += (a === "mas" ? 15 : -15) * 1000;
    ss.descansoTotal = Math.max(ss.descansoTotal, Math.ceil((ss.descansoHasta - Date.now()) / 1000)); guardar();
    if (ss.descansoHasta <= Date.now()) { clearInterval(reloj); reloj = null; finDescanso(); }
    return;
  }
  if (a === "yasta") { clearInterval(reloj); reloj = null; return finDescanso(); }
  if (a === "saltar") { ss.i++; ss.serie = 0; guardar(); return pintarGuia(); }
  if (a === "atras") {
    if (ss.i > 0) { ss.i--; const ea = ejActivo(R.ej[ss.i]), o = objetivo(ea, sem); ss.serie = Math.min(o.series - 1, (ss.sets[ea.id] || []).length); } else ss.i = -1;
    guardar(); return pintarGuia();
  }
  if (a === "terminar") return terminar();
}
// Marca el ritmo de cada repetición (bajá / pausa / subí / arriba) y cuenta las reps
function marcarRitmo(ej){
  const fases = ej.t.split("-").map(Number), divs = document.querySelectorAll("#tempo div"), btn = document.querySelector("[data-g=ritmo]");
  let f = 0, rep = 1, restante = fases[0];
  const avanzar = () => { f = (f + 1) % 4; if (f === 0) rep++; restante = fases[f]; };
  const paso = () => {
    let vueltas = 0; while (restante <= 0 && vueltas++ < 4) avanzar();
    divs.forEach((d, i) => d.classList.toggle("on", i === f));
    btn.textContent = `⏹ Parar · repetición ${rep}`;
    restante--;
  };
  paso(); ritmoOn = setInterval(paso, 1000);
}
function detenerRitmo(){ clearInterval(ritmoOn); ritmoOn = null; }
function resumenFinal(){
  const ss = E.sesion, R = RUTINA[ss.dia];
  let vol = 0, series = 0; Object.values(ss.sets).forEach(a => a.forEach(s => { vol += s.kg * s.reps; series++; }));
  const min = Math.round((Date.now() - ss.desde) / 60000);
  $("#guia").innerHTML = `<div class="guia"><div class="in" style="text-align:center;padding-top:30px"><div style="font-size:80px">🏆</div><h1>¡Terminaste!</h1><p class="muted">${R.nombre}</p>
    <div class="stats" style="margin:18px 0"><div class="stat"><b>${series}</b><small>series</small></div><div class="stat"><b>${Math.round(vol).toLocaleString("es-AR")}</b><small>kg movidos</small></div><div class="stat"><b>${min}</b><small>minutos</small></div></div>
    <div class="consejo" style="text-align:left">🍗 Ahora toca el <b>almuerzo post-entreno</b> con la creatina (5 g). Es la comida más importante del día.</div>
    <button class="btn ok" data-g="terminar" style="margin-top:16px">Guardar y salir</button></div></div>`;
  engancharGuia();
}
function terminar(){
  const ss = E.sesion, sem = semanaActual().n;
  Object.entries(ss.sets).forEach(([id, sets]) => { if (!sets.length) return; (E.hist[id] = E.hist[id] || []).push({f:ss.f, sem, sets}); if (E.hist[id].length > 40) E.hist[id].shift(); });
  E.entrenos[ss.f] = ss.dia; E.sesion = null; guardar(); sonar("fin"); vibrar([80, 60, 80]); cerrarGuia(); toast("💪 Entrenamiento guardado");
}

/* ============ PASAR LOS DATOS A OTRO DISPOSITIVO (sin servidor, por link) ============ */
function b64(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function deb64(s){ return decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))); }
async function exportar(){
  const url = location.href.split("#")[0] + "#p=" + b64(JSON.stringify({...E, sesion:null, comidas:{}, agua:{}}));
  try { if (navigator.share) { await navigator.share({title:"Mis datos de GymBlack", url}); return; } } catch { return; }
  try { await navigator.clipboard.writeText(url); toast("🔗 Link copiado: abrilo en el otro dispositivo"); } catch { toast("No se pudo copiar el link"); }
}
function importarDeLink(){
  const m = /#p=([\w-]+)/.exec(location.hash); if (!m) return;
  try {
    const d = JSON.parse(deb64(m[1]));
    if (d && d.inicio && (!E || !E.inicio || confirm("¿Reemplazar los datos de este dispositivo por los del link?"))) { E = Object.assign(nuevoEstado(), d); guardar(); toast("✅ Datos cargados"); }
  } catch { toast("El link de datos no es válido"); }
  history.replaceState(null, "", location.pathname);
}

importarDeLink();
if (E) E = Object.assign(nuevoEstado(), E);
/* ============ MODO SIN INTERNET: guardar todas las fotos en el celular ============ */
let offline = {total: 0, hechas: 0, fallos: 0, listo: false, empezado: false};
function textoOffline(){
  if (!offline.empezado) return "";
  if (offline.listo) return `<div class="card" style="padding:10px 14px;border-color:#3DDC8466"><b style="color:var(--ok)">✅ Lista para usar sin internet</b><div class="small muted">Rutina, comidas y las ${offline.total} fotos quedaron guardadas en este dispositivo.</div></div>`;
  const pc = offline.total ? Math.round(offline.hechas / offline.total * 100) : 0;
  return `<div class="card" style="padding:10px 14px"><div class="row"><b>📶 Preparando modo sin internet…</b><span class="sp"></span><span class="chip">${pc}%</span></div>
    <div class="barra" style="margin-top:8px"><i style="width:${pc}%"></i></div>
    <div class="small muted" style="margin-top:6px">${offline.fallos ? "Falta conexión para terminar: abrí la app de nuevo con internet." : "Dejá la app abierta un ratito con internet."}</div></div>`;
}
function pintarOffline(){ const d = document.getElementById("offlineEstado"); if (d) d.innerHTML = textoOffline(); }
async function prepararOffline(){
  if (!("caches" in window) || offline.corriendo) return;
  offline.corriendo = true;
  try {
    const fotos = [...new Set(Object.values(MEDIA).flatMap(m => [m.img, ...m.alt.map(a => a.img)]))].flatMap(i => [rutaFoto(i, 0), rutaFoto(i, 1)]);
    const c = await caches.open("gymblack-fotos");
    const ya = new Set((await c.keys()).map(r => decodeURIComponent(new URL(r.url).pathname).split("/ejercicios/")[1]));
    const faltan = fotos.filter(f => !ya.has(f.split("ejercicios/")[1]));
    offline = {...offline, total: fotos.length, hechas: fotos.length - faltan.length, fallos: 0, empezado: true, listo: !faltan.length};
    pintarOffline();
    let i = 0;
    const trabajador = async () => {
      while (i < faltan.length) {
        const f = faltan[i++];
        try { const r = await fetch(f, {cache: "no-cache"}); if (!r.ok) throw 0; await c.put(new URL(f, location.href).href, r); offline.hechas++; } catch { offline.fallos++; }
        pintarOffline();
      }
    };
    await Promise.all(Array.from({length: 6}, trabajador));
    offline.listo = offline.hechas >= offline.total; pintarOffline();
  } catch {} finally { offline.corriendo = false; }
}
addEventListener("online", () => { if (!offline.listo) prepararOffline(); });
setTimeout(prepararOffline, 1500);

render();
if (E && E.sesion && E.sesion.f === hoyStr() && E.sesion.descansoHasta) abrirGuia();
// cada minuto se actualiza «qué comida toca ahora» (si no estás escribiendo nada)
setInterval(() => { if (E && E.inicio && !$("#guia").innerHTML && !(document.activeElement && document.activeElement.tagName === "INPUT")) render(); }, 60000);
</script>
<script>
const VERSION_APP = "20260927233620";
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
  document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
}).catch(() => {}));
async function buscarVersionNueva(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    const v = (await r.json()).v;
    if (v && v !== VERSION_APP) avisarVersionNueva();
  } catch {}
}
function avisarVersionNueva(){
  if (document.getElementById("versionNueva") || document.getElementById("guia").innerHTML) return;
  const d = document.createElement("div"); d.id = "versionNueva";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:10px;align-items:center;" +
    "background:#E4E7EC;color:#0B0C0E;padding:12px 14px;border-radius:16px;font:800 15px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4)";
  d.innerHTML = '<span style="flex:1">✨ Hay una versión nueva de GymBlack</span>';
  const b = document.createElement("button"); b.textContent = "Actualizar";
  b.style.cssText = "border:0;border-radius:12px;padding:9px 14px;font:800 15px system-ui,sans-serif;background:#0B0C0E;color:#E4E7EC";
  b.onclick = () => location.reload();
  d.append(b); document.body.append(d);
}
setTimeout(buscarVersionNueva, 4000);
setInterval(buscarVersionNueva, 20 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) buscarVersionNueva(); });
</script>
